<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05070b" />
    <title>Recent Searches | BreachPoint</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="CSS/styles.css" />
  </head>
  <body class="history-body">
    <header class="topbar">
      <a class="brand" href="index.html#home" aria-label="BreachPoint home"><img class="brand-icon" src="breachpoint-mark.svg" alt="" /><span>Breach</span><strong>Point</strong></a>
      <nav class="main-nav" aria-label="Main navigation">
        <a href="index.html#home"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z" /></svg>Home</a>
        <a href="scan.html"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7V5a1 1 0 0 1 1-1h2m10 0h2a1 1 0 0 1 1 1v2M20 17v2a1 1 0 0 1-1 1h-2m-10 0H5a1 1 0 0 1-1-1v-2" /><path d="m8 12 2.5 2.5L16 9" /></svg>Scan</a>
        <a href="analysis.html"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5m0 14h17" /><path d="m7 15 4-4 3 2 5-6" /><path d="M17 7h2v2" /></svg>Analyze</a>
        <a class="active" href="history.html" aria-current="page"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 2.6-6.4L3 8" /><path d="M3 3v5h5m4-1v5l3 2" /></svg>History</a>
        <a href="settings.html"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z" /><path d="m19.4 15 .1.1 1.1.9-1.5 2.6-1.4-.6a8 8 0 0 1-1.5.9l-.2 1.5h-3l-.3-1.5a8 8 0 0 1-1.5-.9l-1.4.6-1.5-2.6 1.1-.9a7 7 0 0 1 0-1.8l-1.1-.9 1.5-2.6 1.4.6a8 8 0 0 1 1.5-.9l.3-1.5h3l.2 1.5a8 8 0 0 1 1.5.9l1.4-.6 1.5 2.6-1.1.9a7 7 0 0 1-.1 1.8Z" /></svg>Settings</a>
      </nav>
      <button class="profile" type="button" data-profile-control aria-label="Open Kato Aye profile">
        <span class="avatar" aria-hidden="true"><span data-profile-initials>KA</span><img data-profile-avatar-image alt="" hidden /></span>
        <span data-profile-name>Kato Aye</span>
      </button>
    </header>

    <main class="history-page">
      <header class="history-heading">
        <div><p class="report-eyebrow">Your activity</p><h1>Recent searches</h1><p>Links, images, and messages you have checked.</p></div>
        <button class="history-clear" type="button" id="clear-history" hidden>Clear history</button>
      </header>
      <div class="history-controls">
        <div class="history-filters" role="group" aria-label="Filter search history">
          <button class="history-filter active" type="button" data-history-filter="all" aria-pressed="true">All</button>
          <button class="history-filter" type="button" data-history-filter="link" aria-pressed="false">Links</button>
          <button class="history-filter" type="button" data-history-filter="image" aria-pressed="false">Images</button>
          <button class="history-filter" type="button" data-history-filter="message" aria-pressed="false">Messages</button>
        </div>
        <label class="history-search"><span class="visually-hidden">Search history</span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg><input id="history-search" type="search" placeholder="Search history" /></label>
      </div>
      <section class="history-results" id="history-results" aria-live="polite" aria-label="Recent search results"></section>
    </main>
    <script src="JS/app.js" defer></script>
  </body>
</html>
